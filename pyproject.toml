[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.4"]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["apps", "modules", "tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "modules*"]

[tool.setuptools.package-data]
modules = ["py.typed"]
