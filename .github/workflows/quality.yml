name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality_shards:
    name: quality / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: classifier-regression
            pytest_args: tests/classifier_regression
          - shard: classification-routing-and-player-match
            pytest_args: >-
              tests/system/test_classification_routing_outcomes.py
              tests/system/test_player_match_availability.py
          - shard: coaching-system
            pytest_args: tests/system/test_coaching_search.py
          - shard: unit-static
            pytest_args: tests/unit
          - shard: remaining-system-1
            pytest_args: >-
              tests/system/test_acceptance_spine.py
              tests/system/test_discovery_draft.py
              tests/system/test_migrations.py
              tests/system/test_opponent_search.py
              tests/system/test_required_date.py
              tests/system/test_transfer_search.py
          - shard: remaining-system-2
            pytest_args: >-
              tests/system/test_conversation_language.py
              tests/system/test_exact_repost_clusters.py
              tests/system/test_main_menu_settings.py
              tests/system/test_open_match_game_search.py
              tests/system/test_refereeing_opportunities.py
              tests/system/test_search_area.py
              tests/system/test_source_chat_administration.py
              tests/system/test_source_message_ingestion.py
              tests/system/test_zero_result_search.py
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.5"
          cache: pip
      - name: Install locked development dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify disposable PostgreSQL role
        run: |
          python3 - <<'PY'
          import os

          import psycopg

          with psycopg.connect(os.environ["TEST_DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT current_user, current_database()")
                  current_user, current_database = cursor.fetchone()

          if (current_user, current_database) != ("postgres", "postgres"):
              raise SystemExit(
                  "unexpected PostgreSQL identity: "
                  f"{current_user}@{current_database}"
              )

          print("connected as postgres to database postgres")
      - name: Run repository static quality checks
        if: ${{ matrix.shard == 'unit-static' }}
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .
          python3 -m mypy
      - name: Run test shard
        run: python3 -m pytest ${{ matrix.pytest_args }}

  quality:
    name: quality
    if: ${{ always() }}
    needs: quality_shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality shard to pass
        env:
          SHARDS_RESULT: ${{ needs.quality_shards.result }}
        run: |
          if [[ "${SHARDS_RESULT}" != "success" ]]; then
            echo "quality shard result: ${SHARDS_RESULT}"
            exit 1
          fi
